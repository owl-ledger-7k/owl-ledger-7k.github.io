<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>フクリ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="フクリ">
<meta name="theme-color" content="#070908">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=8">
<link rel="icon" href="icon-192.png?v=8">
<link rel="manifest" href="manifest.webmanifest?v=2">
<style>
:root{
  --bg:#eef2f7;--bg2:#dfe7f1;--ink:#0d1520;--sub:#5d6b7c;--mute:#8b97a6;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.72);--edge:rgba(255,255,255,.85);--line:rgba(15,30,50,.08);
  --up:#0a9b62;--dn:#e0453a;--gold:#c9920f;--blue:#0a6cff;--warn:#e08a00;
  --b1:#7cc7ff;--b2:#ffd76a;--b3:#9fe3c9;
  --shadow:0 10px 30px rgba(20,40,70,.12),0 1px 2px rgba(20,40,70,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#060b12;--bg2:#0b1622;--ink:#f2f6fb;--sub:#9aa8b8;--mute:#6c7a8a;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.11);--edge:rgba(255,255,255,.16);--line:rgba(255,255,255,.08);
  --up:#3ddc97;--dn:#ff6b5e;--gold:#f3c54a;--blue:#4a9dff;--warn:#ffb340;
  --b1:#1e5f99;--b2:#7a5a10;--b3:#14634a;
  --shadow:0 12px 34px rgba(0,0,0,.45);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100dvh}
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--bg2),var(--bg))}
.sky i{position:absolute;border-radius:50%;opacity:.7;animation:drift 22s ease-in-out infinite alternate;will-change:transform}
.sky i:nth-child(1){width:90vw;height:90vw;left:-30vw;top:-20vw;background:radial-gradient(closest-side,var(--b1),transparent)}
.sky i:nth-child(2){width:80vw;height:80vw;right:-35vw;top:30vh;background:radial-gradient(closest-side,var(--b2),transparent);animation-delay:-8s}
.sky i:nth-child(3){width:80vw;height:80vw;left:0;bottom:-35vw;background:radial-gradient(closest-side,var(--b3),transparent);animation-delay:-14s}
/* 上（時計の所）と下（タブの裏）を背景色でなじませる */
.fadeT,.fadeB{position:fixed;left:0;right:0;z-index:3;pointer-events:none}
.fadeT{top:0;height:env(safe-area-inset-top,0px);background:var(--bg2)}
.fadeB{bottom:0;height:calc(env(safe-area-inset-bottom) + 90px);background:linear-gradient(transparent,var(--bg) 75%)}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.12)}}
main{position:relative;z-index:1;min-height:100dvh;
  padding:calc(env(safe-area-inset-top,0px) + 48px) 0 calc(env(safe-area-inset-bottom) + 120px)}
.page{display:none;animation:in .35s cubic-bezier(.2,.8,.2,1)}
.page.on{display:block}
@keyframes in{from{opacity:0}to{opacity:1}}
.hd{padding:6px 22px 4px}
.hd .eyebrow{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.hd h1{margin:2px 0 0;font-size:34px;font-weight:800;letter-spacing:-.02em}
.big{font-size:58px;font-weight:800;letter-spacing:-.045em;line-height:1.02;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.big small{font-size:.42em;font-weight:700;margin-left:2px;letter-spacing:0}
.big .sg{font-size:.6em;margin-right:2px}
.big.up{color:var(--up)}.big.dn{color:var(--dn)}
.cap{font-size:13.5px;color:var(--sub);line-height:1.6}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%)}
.card{margin:12px 16px;padding:16px 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;gap:8px;padding:10px 16px 2px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--sub)}
.chip.on{color:var(--ink);background:var(--glass2)}
.chip b{font-variant-numeric:tabular-nums;margin-left:4px}
.st{display:flex;gap:10px;margin:0 16px}
.st .glass{flex:1;padding:12px 14px;border-radius:20px}
.st small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.st b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sec{margin:22px 22px 6px;font-size:13px;font-weight:700;color:var(--sub);display:flex;justify-content:space-between}
/* IPOカード */
.ipo .nm{font-size:17px;font-weight:700;line-height:1.35}
.ipo .cd{font-size:12.5px;color:var(--mute);font-weight:600}
.br{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:10px}
.br .bn{font-size:12px;font-weight:800;color:var(--sub)}
.steps{display:flex;align-items:center}
.sp{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto;min-width:54px}
.sp i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;
  background:var(--line);color:var(--mute)}
.sp span{font-size:11px;font-weight:700;color:var(--mute);white-space:nowrap}
.sp.ok i{background:var(--up);color:#fff}.sp.ok span{color:var(--up)}
.sp.ng i{background:var(--mute);color:#fff}.sp.ng span{color:var(--sub)}
.sp.gold i{background:linear-gradient(135deg,#ffe07a,#d39a12);color:#4a3300}.sp.gold span{color:var(--gold)}
.sp.warn i{background:var(--warn);color:#fff}.sp.warn span{color:var(--warn)}
.sp.now i{box-shadow:0 0 0 4px rgba(10,108,255,.18);background:var(--blue);color:#fff}.sp.now span{color:var(--blue)}
.ln{flex:1;height:2px;background:var(--line);margin:0 -6px 16px;min-width:12px}
.ln.ok{background:var(--up)}
.memo{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;margin-left:6px;vertical-align:2px}
.tag.g{background:rgba(10,155,98,.15);color:var(--up)}.tag.b{background:rgba(224,69,58,.13);color:var(--dn)}.tag.n{background:var(--line);color:var(--sub)}
.empty{text-align:center;color:var(--sub);font-size:14px;line-height:1.8;padding:30px 20px}
/* 予定 */
.day{margin:14px 16px 0}
.day .dl{font-size:13px;font-weight:800;color:var(--sub);margin:0 6px 6px;display:flex;gap:8px;align-items:baseline}
.day .dl b{font-size:22px;color:var(--ink);letter-spacing:-.02em}
.ev{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:12px 16px}
.ev+.ev{border-top:1px solid var(--line)}
.ev .dot{width:10px;height:10px;border-radius:50%}
.ev .t{font-size:15px;font-weight:700;line-height:1.35}
.ev .s{font-size:12px;color:var(--sub);font-weight:600;margin-top:1px}
.ev .r{font-size:12.5px;font-weight:800;text-align:right;white-space:nowrap}
.today{color:var(--blue)}
/* FX */
.live{padding:16px 18px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pl 1.8s infinite}
.pulse.off{background:var(--mute);animation:none}
@keyframes pl{70%{box-shadow:0 0 0 10px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.pos{padding:12px 0;border-top:1px solid var(--line)}
.pos:first-of-type{border-top:0}
.pos .k{font-size:12px;font-weight:800;letter-spacing:.04em}
.k.hold{color:var(--gold)}.k.wait{color:var(--blue)}
.pos .t{font-size:16px;font-weight:700;margin-top:2px}
.pos .w{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.55}
.pos .p{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chart{margin:12px 16px;padding:14px 0 8px;touch-action:none;user-select:none;-webkit-user-select:none}
.chart .top{padding:0 18px;min-height:46px}
.chart .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chart .d{font-size:12px;color:var(--sub);font-weight:600}
.chart svg{display:block;width:100%;height:180px}
.seg{display:flex;margin:4px 18px 0;padding:3px;border-radius:12px;background:var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--sub);font:700 12.5px/1 inherit;padding:8px 0;border-radius:9px}
.seg button.on{background:var(--glass2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tr{margin:10px 16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.tr .a{font-size:15px;font-weight:700}
.tr .b{font-size:12.5px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.tr .p{grid-row:1/3;grid-column:2;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}
.side{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;margin-right:6px;vertical-align:1px}
.side.buy{background:rgba(10,155,98,.15);color:var(--up)}.side.sell{background:rgba(224,69,58,.13);color:var(--dn)}
/* タブバー（液体ガラス） */
nav.glass{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);
  display:flex;gap:4px;padding:6px;border-radius:999px}
nav button{position:relative;z-index:1;border:0;background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;
  width:72px;padding:8px 0 6px;font:700 11px/1 inherit;border-radius:999px;transition:color .25s}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue)}
nav .blob{position:absolute;z-index:0;top:6px;bottom:6px;width:72px;border-radius:999px;background:var(--glass2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 10px rgba(0,0,0,.08);transition:transform .45s cubic-bezier(.3,1.4,.4,1)}
.topbtn{position:fixed;z-index:4;right:16px;top:calc(env(safe-area-inset-top,0px) + 10px);width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;border:1px solid var(--edge)}
.topbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.topbtn.bell{right:64px}.topbtn.bell.on svg{fill:var(--gold);stroke:var(--gold)}
.topbtn.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.gate{position:fixed;inset:0;z-index:9;display:none;place-items:center;padding:30px;text-align:center;background:var(--bg)!important;border:0!important;border-radius:0!important}
body.lock main,body.lock nav,body.lock .topbtn,body.lock .fadeB{display:none!important}
.gate.on{display:grid}
.gate::before{display:none}
.gate h2{margin:14px 0 6px}
.gate img{width:96px;height:96px;border-radius:22px;box-shadow:var(--shadow)}
.foot{font-size:11.5px;color:var(--mute);text-align:center;margin:18px 20px;line-height:1.7}
.toast{position:fixed;z-index:8;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-80px);transition:transform .35s;
  padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700}
.toast.on{transform:translate(-50%,0)}
/* 設定 */
.set .row+.row{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.set .t{font-size:15px;font-weight:700}.set .s{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.55}
.btn{border:0;border-radius:14px;padding:11px 16px;font:700 14px/1 inherit;background:var(--blue);color:#fff;white-space:nowrap}
.btn.sub{background:var(--line);color:var(--ink)}
.btn.g{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.btn.g svg{width:18px;height:18px}
.gate .btn{margin-top:14px}

/* ===== テーマD：黒×金（上のぼかしも黒でなじむ） ===== */
:root,:root:not(#x){--bg:#0b0b0c;--bg2:#0b0b0c;--ink:#f2efe8;--sub:#9a958c;--mute:#6e6a63;
  --glass:#161618;--glass2:#1f1f22;--edge:#26262a;--line:#2a2a2e;
  --up:#4ccf8a;--dn:#ff6b5e;--gold:#d6b26a;--blue:#d6b26a;--warn:#e0a040;--shadow:none}
@media (prefers-color-scheme:light){:root{--bg:#0b0b0c;--bg2:#0b0b0c;--ink:#f2efe8;--sub:#9a958c;--mute:#6e6a63;
  --glass:#161618;--glass2:#1f1f22;--edge:#26262a;--line:#2a2a2e;--up:#4ccf8a;--dn:#ff6b5e;--gold:#d6b26a;--blue:#d6b26a;--warn:#e0a040;--shadow:none}}
html,body{background:#0b0b0c!important;color-scheme:dark}
.sky{display:none}
.glass{background:var(--glass);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--edge);box-shadow:none;border-radius:14px}
.glass::before{display:none}
main{padding:calc(env(safe-area-inset-top,0px) + 22px) 0 calc(env(safe-area-inset-bottom) + 96px)}
.hd{padding:6px 22px 10px}
.hd .eyebrow{color:var(--sub);letter-spacing:.12em;font-size:12px}
.hd h1{font-size:30px}
.chip.on,.seg button.on{background:var(--glass2);color:var(--gold);box-shadow:none}
.sp.now i{background:var(--gold);color:#111;box-shadow:0 0 0 4px rgba(214,178,106,.18)}.sp.now span{color:var(--gold)}
.fadeT{height:env(safe-area-inset-top,0px);background:#0b0b0c}
.fadeB{display:none}
/* 下のタブ：画面の下にぴったり付くバー */
nav.glass{left:0;right:0;transform:none;bottom:0;border-radius:0;border:0;border-top:1px solid var(--line);background:rgba(11,11,12,.96);
  padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);justify-content:space-around;gap:0}
nav .blob{display:none}
nav button{width:20%;padding:6px 0 4px;color:var(--mute);font-size:11px}
nav button.on{color:var(--gold)}
nav button svg{width:26px;height:26px}
.topbtn{top:calc(env(safe-area-inset-top,0px) + 4px);background:var(--glass)!important;border:1px solid var(--edge)!important;border-radius:50%!important}
.topbtn svg{stroke:var(--ink)}
.toast{background:var(--glass2)!important;color:var(--ink);border:1px solid var(--edge)!important}
.gate{background:#0b0b0c!important}
.btn{background:var(--gold);color:#111}.btn.sub{background:var(--glass2);color:var(--ink)}
#alert{display:none;position:sticky;top:0;z-index:30;margin:calc(env(safe-area-inset-top) + 8px) 12px 0;padding:14px 16px;border-radius:18px;background:#d93025;color:#fff;box-shadow:0 8px 24px rgba(217,48,37,.35)}
#alert.on{display:block}#alert b{display:block;font-size:16px;margin-bottom:4px}#alert .m{font-size:13px;line-height:1.5;opacity:.95;margin-top:4px}
#alert button{margin-top:10px;border:0;border-radius:12px;padding:8px 14px;background:#fff;color:#d93025;font-weight:800;font-size:13px}
.sw{position:relative;width:51px;height:31px;flex:none;border-radius:16px;background:#3a3a3e;border:0;transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--gold)}.sw.on::after{transform:translateX(20px)}
.todo .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.todo .it:first-of-type{border-top:0;padding-top:4px}
.todo .tt{font-size:15px;font-weight:700;line-height:1.4}.todo .ts{font-size:12px;word-break:auto-phrase;color:var(--sub);margin-top:2px;line-height:1.55}
.todo .w .tt{color:var(--warn)}
.btn.s{padding:9px 12px;font-size:13px;border-radius:12px;text-decoration:none;display:inline-block}
.cash .it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cash .it:first-of-type{border-top:0}
.cash b{font-size:20px;font-variant-numeric:tabular-nums}
.chart{touch-action:pan-y}
/* 画面全体は固定し、中身だけスクロール（引っぱっても画面が動かない） */
html,body{overscroll-behavior:none}
main{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:none;min-height:0}
/* FXの取引：1行の細いリスト */
.trl{margin:8px 16px;padding:2px 14px}
.trr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;font-variant-numeric:tabular-nums}
.trr:first-child{border-top:0}
.trr .dt{color:var(--sub);width:84px;flex:none;white-space:nowrap}.trr .nm{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trr .pp{font-weight:800;font-size:13.5px}
.trr .side{font-size:10px;padding:1px 5px;margin-right:4px}
/* 申込：細いリスト */
.mini .br{grid-template-columns:34px 1fr;gap:6px;padding:5px 0 0;margin-top:5px;border-top:0}
.mini .br .bn{font-size:10.5px}
.mini .sp{min-width:40px;gap:2px}.mini .sp i{width:17px;height:17px;font-size:10px}.mini .sp span{font-size:9.5px}
.mini .ln{margin:0 -4px 13px;min-width:8px}
.mini .memo{font-size:11px;margin-top:2px}
.mcar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 2px;scrollbar-width:none;overscroll-behavior-x:contain}
.mcar::-webkit-scrollbar{display:none}
.mc{flex:0 0 calc(100% - 8px);scroll-snap-align:center;padding:20px 22px;border-radius:20px!important}
.ml{font-size:14px;font-weight:700;color:var(--sub)}
.mv{font-size:46px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.ms{font-size:12.5px;color:var(--sub)}
.mk{font-size:13px;color:var(--sub);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.mk b{font-size:15px}
.trbox{margin:0!important;padding:0!important;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#fxtr{margin-bottom:0}
.mdots{text-align:center;font-size:11px;color:var(--mute);margin:8px 0 0}
.ir{padding:9px 0;border-top:1px solid var(--line)}.ir:first-child{border-top:0}
.ir .in{display:flex;align-items:baseline;gap:6px;min-width:0}
.ir .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.ir .cd{font-size:11px;color:var(--mute);margin-left:auto;white-space:nowrap}
.tg{font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;flex:none}.tg.g{background:rgba(76,207,138,.15);color:var(--up)}.tg.b{background:rgba(255,107,94,.13);color:var(--dn)}.tg.p{background:rgba(167,139,250,.16);color:#A78BFA}
.bcs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}

    if(!sub)sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({kind:'sub',key:KEY,sess:SESS,sub:sub.toJSON()})}).then(r=>r.json());
    if(!res.ok)throw 0;toast('通知がつながりました');bellState();
  }catch(e){toast('通知の登録に失敗しました')}
}
{const q=new URLSearchParams(location.search).get('tab');if(q)store.set('fk_tab',q),TAB=q}

// 前回の中身をすぐ出してから最新を読む
if(KEY&&!SESS&&!location.hash.includes('id_token'))needLogin();
if(SESS){try{const c=JSON.parse(store.get('fk_cache')||'null');if(c){D=c.D;KDD=c.KDD;render()}}catch(_){}}
renderSet();go(TAB);gReturn().then(()=>{if(SESS)load()});

// 更新の自動反映：新しい版が出ていたら読み直す
async function checkVer(){try{const v=(await fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.text())).trim();if(v&&v!==VERSION)location.reload()}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkVer();if(SESS)load()}});
checkVer();
</script>
